name: Mise à jour des prévisions orageuses

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Permissions nécessaires pour que le bot puisse pousser le commit
permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation de ecCodes (C library)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Génération des prévisions
        run: python backend/generer_previsions.py

      - name: Vérification du fichier de sortie
        run: |
          if [ ! -s data/previsions_orages.json ]; then
            echo "ERREUR : le fichier GeoJSON est vide ou absent" >&2
            exit 1
          fi

      - name: Configuration de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit et push du GeoJSON
        run: |
          git add data/previsions_orages.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans le GeoJSON, rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour automatique des prévisions orageuses"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}