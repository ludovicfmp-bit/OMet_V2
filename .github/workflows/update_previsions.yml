name: Mise à jour des prévisions orageuses

# Déclencheurs du workflow
on:
  schedule:
    # Exécution toutes les 3 heures (à 0h, 3h, 6h, 9h, 12h, 15h, 18h, 21h UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:   # Permet de lancer manuellement depuis l'onglet Actions

# Le job s'exécute sur la dernière version d'Ubuntu
jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Installer Python 3.10
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Installer la bibliothèque système ecCodes (nécessaire pour le paquet Python eccodes)
      - name: Installation de ecCodes (C library)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      # 4. Installer les dépendances Python listées dans requirements.txt
      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Exécuter le script de génération des prévisions
      - name: Génération des prévisions
        run: python backend/generer_previsions.py

      # 6. Vérifier que le fichier GeoJSON a bien été créé et n'est pas vide
      - name: Vérification du fichier de sortie
        run: |
          if [ ! -s data/previsions_orages.json ]; then
            echo "ERREUR : le fichier GeoJSON est vide ou absent" >&2
            exit 1
          fi

      # 7. Configurer Git pour le commit automatique
      - name: Configuration de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 8. Ajouter, committer et pousser le fichier mis à jour
      - name: Commit et push du GeoJSON
        run: |
          git add data/previsions_orages.json
          # Vérifier s'il y a des changements à committer
          if git diff --cached --quiet; then
            echo "Aucun changement dans le GeoJSON, rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour automatique des prévisions orageuses"
          git push
        env:
          # Le token GitHub est fourni automatiquement et donne les droits d'écriture
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}